<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="AIf.ico">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <title>Beta記憶サポートAI</title>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f2fe, #f0f9ff);
      --container-bg: rgba(255, 255, 255, 0.75);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #81a0b3;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --border-color: #cbd5e1;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --text-dark: white;
      --back-dark: black;
      --usually: #696969; 
    }

    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
      --container-bg: rgba(30, 41, 59, 0.85);
      --card-bg: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --border-color: #475569;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      --text-dark: black;
      --back-dark: white;
      --usually: #191970;
    }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      padding: 20px 12px;
      transition: background 0.3s ease;
    }

    .container {
      max-width: 640px;
      width: 100%;
      box-sizing: border-box;
      margin: auto;
      background: var(--container-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
/*文字サポートAIをカクカク表示*/
    h1 {
      margin: 0;
      font-size: 24px;
      color: var(--primary);
      font-weight: 700;
      font-family: monospace;
      display: inline-block;
    　position: relative;
      overflow: hidden;
      border-right: 2px solid #333;
      white-space: nowrap;
      width: 0;
      animation: typing 3s steps(8, end) forwards;
    }
    h1 span {
      display: inline-block;
      opacity: 0;
      animation: fadeIn 0.1s forwards;
    }
    @keyframes typing {
      from, { border-color: transparent;}
      to { width: 8em;}
    }
    @keyframes blink {
      from, to { boder-color: transparent;}
      50% { border-color: #333;}
    }
      
    .theme-toggle {
      background-color: var(usually);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .theme-toggle:hover {
      background-color: var(--back-dark);
      color: var(--text-dark)
    }

    textarea, input[type="text"] {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      padding: 12px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    textarea {
      height: 110px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 10px;
      background-color: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .action-btn {
      display: block;
      margin: 12px auto;
      font-size: 15px;
      padding: 10px 24px;
    }

    .section {
      margin-top: 24px;
    }

    .ocr-dropzone {
      border: 2px dashed var(--primary);
      background: rgba(56, 189, 248, 0.05);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 14px;
      color: var(--text-muted);
    }

    .ocr-dropzone:hover {
      background: rgba(36, 0, 248, 0.12);
    }

    .tags span, .filter-tags span {
      display: inline-block;
      background-color: rgba(26, 189, 248, 0.15);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 16px;
      margin: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-tags span.active {
      background-color: var(--primary);
      color: white;
    }

    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filter-box {
      background: rgba(0, 0, 0, 0.03);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .timestamp {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .summary-text-box {
      font-size: 13px;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid var(--primary);
      padding: 8px 12px;
      margin-top: 8px;
      border-radius: 0 8px 8px 0;
    }

    .memory-item {
      margin: 10px 0;
      padding: 14px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease;
    }
    .memory-item:hover {
      transform: translateY(-2px);
    }

    /* 🧠 神経衰弱 3Dカード */
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      border-radius: 10px;
    }

    .card.flipped, .card.matched {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    .card-back {
      background: var(--primary);
      color: white;
    }

    .card-front {
      background: var(--card-bg);
      transform: rotateY(180deg);
      border: 2px solid var(--primary);
      padding: 4px;
    }

    .card-front img, .card-back img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* 🎮 ブロック崩し */
    #gameCanvas {
      background: #0f172a;
      display: block;
      margin: 12px auto;
      border-radius: 12px;
      box-shadow: var(--shadow);
      touch-action: none;
      max-width: 100%;
    }

    .game-controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }
    .game-controls button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      touch-action: manipulation;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header-bar">
     <h1>記憶サポートＡＩ</h1>

    <!-- 自動タグ -->

    <div class="section">

          <span data-tag="ゲーム">ゲーム</span>

        ボールを弾いてブロックを壊そう！

      <canvas id="gameCanvas" width="480" height="300"></canvas>

  </div>




    
  <script>
    // ---  Web Audio API（演出効果音エンジン） ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(freq, type = 'sine', duration = 0.1) {
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.log("Audio play error:", e);
      }
    }

    // --- ダークモード切り替え --- 
    const themeToggle = document.getElementById("themeToggle");
    const currentTheme = localStorage.getItem("theme") || "light";
    if (currentTheme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
      themeToggle.textContent = "☀️ ライト";
    }

    themeToggle.addEventListener("click", () => {
      let theme = document.documentElement.getAttribute("data-theme");
      if (theme === "dark") {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("theme", "light");
        themeToggle.textContent = "🌙 ダーク";
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("theme", "dark");
        themeToggle.textContent = "☀️ ライト";
      }
    });

    const inputText = document.getElementById("inputText");
    const saveBtn = document.getElementById("saveBtn");
    const saveSummaryBtn = document.getElementById("saveSummaryBtn");
    const memoryList = document.getElementById("memoryList");
    const summaryOutput = document.getElementById("summaryOutput");
    const summarizeBtn = document.getElementById("summarizeBtn");
    const copyBtn = document.getElementById("copyBtn");
    const tagsArea = document.querySelector(".tags");
    const searchInput = document.getElementById("searchInput");
    const filterTags = document.getElementById("filterTags");

    const imageInput = document.getElementById("imageInput");
    const dropzone = document.getElementById("dropzone");
    const ocrStatus = document.getElementById("ocrStatus");

    let selectedFilterTag = "ALL";

    // --- OCR処理 ---
    imageInput.addEventListener("change", (e) => {
      if (e.target.files.length > 0) processImage(e.target.files[0]);
    });
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); });
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) processImage(e.dataTransfer.files[0]);
    });

    function preprocessImage(file, callback) {
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const scale = Math.max(1, 1500 / Math.max(img.width, img.height));
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const avg = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          const v = avg >= 128 ? 255 : 0;
          d[i] = d[i + 1] = d[i + 2] = v;
        }
        ctx.putImageData(imgData, 0, 0);
        callback(canvas.toDataURL("image/png"));
      };
    }

    async function processImage(file) {
      ocrStatus.textContent = "⌛ 画像を読み取り中…";
      preprocessImage(file, async (processedImageData) => {
        try {
          const worker = await Tesseract.createWorker("jpn+eng");
          await worker.setParameters({ tessedit_pageseg_mode: Tesseract.PSM.AUTO });
          const ret = await worker.recognize(processedImageData);
          await worker.terminate();

          const extractedText = ret.data.text.replace(/([一-龠ぁ-んァ-ヶ])\s+([一-龠ぁ-んァ-ヶ])/g, "$1$2").trim();
          if (extractedText) {
            inputText.value = extractedText;
            classifyTags(extractedText);
            ocrStatus.textContent = "✅ 文字読み取り完了！";
          } else {
            ocrStatus.textContent = "⚠️ 文字が検出できませんでした。";
          }
        } catch (err) {
          ocrStatus.textContent = "❌ エラー: " + err;
        }
      });
    }

    // --- コピー機能 ---
    copyBtn.addEventListener("click", () => {
      const text = summaryOutput.textContent;
      if (!text || text.startsWith("（")) return;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = "完了！";
        setTimeout(() => { copyBtn.textContent = "コピー"; }, 1500);
      });
    });

    function getFormattedTimestamp() {
      const now = new Date();
      return `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    // --- メモ保存・表示 ---
    saveBtn.addEventListener("click", () => {
      const text = inputText.value.trim();
      if (!text) return alert("メモが空です。");
      const summary = summaryOutput.textContent.startsWith("（") ? "" : summaryOutput.textContent;
      const currentTags = Array.from(document.querySelectorAll(".tags span")).map(span => span.textContent);
      saveMemory(text, summary, currentTags);
      inputText.value = "";
      classifyTags("");
      ocrStatus.textContent = "";
    });

    saveSummaryBtn.addEventListener("click", () => {
      const summary = summaryOutput.textContent;
      if (!summary || summary.startsWith("（")) return alert("要約結果がありません。");
      const currentTags = Array.from(document.querySelectorAll(".tags span")).map(span => span.textContent);
      saveMemory(`【要約メモ】${summary}`, "", currentTags);
    });

    function saveMemory(text, summary, tags) {
      const saved = JSON.parse(localStorage.getItem("memoryData") || "[]");
      saved.push({ text, summary, tags, timestamp: getFormattedTimestamp() });
      localStorage.setItem("memoryData", JSON.stringify(saved));
      renderMemoryList();
    }

    function renderMemoryList() {
      const saved = JSON.parse(localStorage.getItem("memoryData") || "[]");
      const keyword = searchInput.value.toLowerCase().trim();
      memoryList.innerHTML = "";

      const filtered = saved.filter(item => {
        const matchKeyword = item.text.toLowerCase().includes(keyword) || (item.summary && item.summary.toLowerCase().includes(keyword));
        const matchTag = (selectedFilterTag === "ALL") || item.tags.includes(selectedFilterTag);
        return matchKeyword && matchTag;
      });

      if (filtered.length === 0) {
        memoryList.innerHTML = "<div style='color:var(--text-muted); font-size:14px; text-align:center;'>該当するメモがありません</div>";
        return;
      }

      filtered.forEach((item) => {
        const div = document.createElement("div");
        div.className = "memory-item";

        const textEl = document.createElement("div");
        textEl.textContent = `★ ${item.text}`;
        textEl.style.fontWeight = "600";
        div.appendChild(textEl);

        if (item.summary) {
          const summaryEl = document.createElement("div");
          summaryEl.className = "summary-text-box";
          summaryEl.textContent = `💡 要約: ${item.summary}`;
          div.appendChild(summaryEl);
        }

        const timeEl = document.createElement("div");
        timeEl.className = "timestamp";
        timeEl.textContent = item.timestamp ? `🕒 ${item.timestamp}` : "";
        div.appendChild(timeEl);

        const footerBox = document.createElement("div");
        footerBox.style.marginTop = "8px";
        footerBox.style.display = "flex";
        footerBox.style.justifyContent = "space-between";
        footerBox.style.alignItems = "center";

        const tagBox = document.createElement("div");
        item.tags.forEach(tag => {
          const tagEl = document.createElement("span");
          tagEl.textContent = tag;
          tagEl.style.fontSize = "12px";
          tagEl.style.marginRight = "4px";
          tagEl.style.padding = "2px 8px";
          tagEl.style.borderRadius = "10px";
          tagEl.style.background = "rgba(56, 189, 248, 0.15)";
          tagEl.style.color = "var(--primary)";
          tagBox.appendChild(tagEl);
        });
        footerBox.appendChild(tagBox);

        const delBtn = document.createElement("button");
        delBtn.textContent = "削除";
        delBtn.style.padding = "3px 8px";
        delBtn.style.background = "#ef4444";
        delBtn.style.fontSize = "12px";
        delBtn.onclick = () => {
          const idx = saved.indexOf(item);
          if (idx > -1) {
            saved.splice(idx, 1);
            localStorage.setItem("memoryData", JSON.stringify(saved));
            renderMemoryList();
          }
        };

        footerBox.appendChild(delBtn);
        div.appendChild(footerBox);
        memoryList.appendChild(div);
      });
    }

    searchInput.addEventListener("input", renderMemoryList);
    filterTags.addEventListener("click", (e) => {
      if (e.target.tagName === "SPAN") {
        document.querySelectorAll("#filterTags span").forEach(el => el.classList.remove("active"));
        e.target.classList.add("active");
        selectedFilterTag = e.target.getAttribute("data-tag");
        renderMemoryList();
      }
    });
    renderMemoryList();

    // --- 自動タグ分類 ---
    const tagRules = { 
        "明日": "予定", 
        "会議": "予定", 
        "アイデア": "アイデア", 
        "勉強": "学習",
        "設定": "設定",
        "生活": "生活",
        "ゴミ出し": "生活",
        "買い出し": "生活",
        "買う": "生活",
        "掃除": "生活",
        "衣替え": "生活",
        "宅配": "生活",
        "学校": "学習",
        "資格": "学習",
        "受験": "学習",
        "模試": "学習",
        "ショッピング": "生活",
        "買い物": "生活",
        "クリーニング": "生活",
        "旅行": "移動",
        "遠征": "移動",
        "打ち合わせ": "予定",
        "作業": "予定",
        "用事": "予定",
        "習い事": "予定",
        "レッスン": "予定",
        "イベント": "予定",
        "約束": "予定",
        "締め切り": "予定",
        "予定": "予定",
        "移動": "移動",
        "出発": "移動",
        "到着": "移動",
        "直行": "移動",
        "寄り道": "移動",
        "車": "移動",
        "新幹線": "移動",
        "飛行機": "移動",
        "バス": "移動",
        "タクシー": "移動",
        "ドライブ": "移動",
        "ツアー": "移動",
        "出": "移動"
        
    };
    function classifyTags(text) {
      const detectedTags = new Set();
      for (const keyword in tagRules) {
        if (text.includes(keyword)) detectedTags.add(tagRules[keyword]);
      }
      tagsArea.innerHTML = "";
      if (detectedTags.size === 0) {
        tagsArea.innerHTML = "<span>未分類</span>";
        return;
      }
      detectedTags.forEach(tag => {
        const span = document.createElement("span");
        span.textContent = tag;
        tagsArea.appendChild(span);
      });
    }
    inputText.addEventListener("input", () => classifyTags(inputText.value));

    // --- 自動要約機能 ---
    function summarizeTextLocal(text, numSentences = 2) {
      if (!text.trim()) return "（入力が空です）";
      const rawSentences = text.split(/(?<=[。\n])/).map(s => s.trim()).filter(Boolean);
      if (rawSentences.length <= numSentences) return text;
      const words = text.match(/[一-龠]+|[ァ-ヴー]+|[a-zA-Z0-9]+/g) || [];
      const wordFreq = {};
      words.forEach(w => { if (w.length > 1) wordFreq[w] = (wordFreq[w] || 0) + 1; });
      return rawSentences
        .map((sentence, index) => {
          let score = 0;
          for (const [w, c] of Object.entries(wordFreq)) { if (sentence.includes(w)) score += c; }
          return { sentence, index, score };
        })
        .sort((a, b) => b.score - a.score)
        .slice(0, numSentences)
        .sort((a, b) => a.index - b.index)
        .map(item => item.sentence).join("");
    }
    summarizeBtn.onclick = () => { summaryOutput.textContent = summarizeTextLocal(inputText.value, 2); };

    // --- 神経衰弱ゲーム ---
    const startGameBtn = document.getElementById("startGameBtn");
    const gameBoard = document.getElementById("gameBoard");
    const gameStatus = document.getElementById("gameStatus");

    const allCardImages = ["AIshinkei.png", "AIshinkei(fuji).png", "Aishinkei(apple).png", "AI.png", "AIshinkei(star).png", "AIshinkei(yamanashi).png"];
    const BACK_IMAGE_SRC = "AIshinkei-.png";

    let memoryStage = 1, cards = [], flippedCards = [], matchedCount = 0;

    startGameBtn.addEventListener("click", () => {
      initAudio();
      memoryStage = 1;
      initMemoryStage();
    });

    function initMemoryStage() {
      gameBoard.innerHTML = "";
      flippedCards = []; matchedCount = 0;

      let pairCount = Math.min(3 + memoryStage - 1, 6);
      const selectedImages = allCardImages.slice(0, pairCount);
      cards = [...selectedImages, ...selectedImages].sort(() => Math.random() - 0.5);

      cards.forEach((symbol) => {
        const cardEl = document.createElement("div");
        cardEl.className = "card";
        cardEl.dataset.symbol = symbol;

        const backDiv = document.createElement("div");
        backDiv.className = "card-back";
        const backImg = document.createElement("img");
        backImg.src = BACK_IMAGE_SRC;
        backDiv.appendChild(backImg);

        const frontDiv = document.createElement("div");
        frontDiv.className = "card-front";
        const frontImg = document.createElement("img");
        frontImg.src = symbol;
        frontDiv.appendChild(frontImg);

        cardEl.appendChild(backDiv);
        cardEl.appendChild(frontDiv);
        cardEl.onclick = () => flipCard(cardEl);
        gameBoard.appendChild(cardEl);
      });

      gameStatus.textContent = `🎯 STAGE ${memoryStage} （ペア数: ${pairCount}）`;
    }

    function flipCard(card) {
      if (flippedCards.length === 2 || card.classList.contains("flipped")) return;
      card.classList.add("flipped");
      playSound(523.25, 'sine', 0.08); // C5音
      flippedCards.push(card);
      if (flippedCards.length === 2) checkMatch();
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      if (c1.dataset.symbol === c2.dataset.symbol) {
        c1.classList.add("matched");
        c2.classList.add("matched");
        flippedCards = [];
        matchedCount += 2;
        playSound(659.25, 'triangle', 0.15); // E5音

        if (matchedCount === cards.length) {
          setTimeout(() => playSound(880, 'sine', 0.3), 150); // A5音
          gameStatus.textContent = `🎉 STAGE ${memoryStage} クリア！`;

          // 保存するか確認ダイアログを表示
          setTimeout(() => {
            if (confirm(`🎉 STAGE ${memoryStage} クリア！この記録を記憶リストに保存しますか？`)) {
              saveMemory(`神経衰弱クリア: STAGE ${memoryStage}`, "", ["ゲーム"]);
            }
            memoryStage++;
            initMemoryStage();
          }, 500);
        }
      } else {
        setTimeout(() => {
          playSound(220, 'sawtooth', 0.1); // 低音エラー
          c1.classList.remove("flipped");
          c2.classList.remove("flipped");
          flippedCards = [];
        }, 800);
      }
    }

    // --- ブロック崩しゲーム（復旧＆追加） ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startBreakoutBtn = document.getElementById("startBreakoutBtn");
    const breakoutStatus = document.getElementById("breakoutStatus");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");

    let ballX, ballY, dx, dy, paddleX, paddleWidth = 75;
    let bricks = [], stage = 1, isPlaying = false, animationFrameId = null;
    let rightPressed = false, leftPressed = false;

    // キーボード操作リスナー
    document.addEventListener("keydown", (e) => {
      if (e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = true;
      if (e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = true;
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = false;
      if (e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = false;
    });

    // ボタン操作リスナー
    const setLeft = (val) => { leftPressed = val; };
    const setRight = (val) => { rightPressed = val; };

    leftBtn.addEventListener("mousedown", () => setLeft(true));
    leftBtn.addEventListener("mouseup", () => setLeft(false));
    leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); setLeft(true); });
    leftBtn.addEventListener("touchend", () => setLeft(false));

    rightBtn.addEventListener("mousedown", () => setRight(true));
    rightBtn.addEventListener("mouseup", () => setRight(false));
    rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); setRight(true); });
    rightBtn.addEventListener("touchend", () => setRight(false));

    // マウス・スワイプ直感移動
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddleX = relativeX - paddleWidth / 2;
      }
    });
    canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        const rect = canvas.getBoundingClientRect();
        const relativeX = e.touches[0].clientX - rect.left;
        if (relativeX > 0 && relativeX < canvas.width) {
          paddleX = relativeX - paddleWidth / 2;
        }
      }
    }, { passive: true });

    // スタートボタン処理
    startBreakoutBtn.addEventListener("click", () => {
      initAudio();
      stage = 1;
      initStage();
    });

    function initStage() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      ballX = canvas.width / 2;
      ballY = canvas.height - 30;
      dx = 2.5 + stage * 0.3;
      dy = -(2.5 + stage * 0.3);
      paddleX = (canvas.width - paddleWidth) / 2;
      isPlaying = true;

      bricks = [];
      for (let c = 0; c < 5; c++) {
        bricks[c] = [];
        for (let r = 0; r < 3; r++) {
          bricks[c][r] = { status: 1 };
        }
      }
      breakoutStatus.textContent = `🎯 STAGE ${stage} 開始！`;
      playSound(440, 'sine', 0.1);
      draw();
    }

    // ブロック崩し描画ループ
    function draw() {
      if (!isPlaying) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ブロック描画と衝突判定
      let remaining = 0;
      for (let c = 0; c < 5; c++) {
        for (let r = 0; r < 3; r++) {
          if (bricks[c][r].status === 1) {
            remaining++;
            let bx = c * 85 + 35, by = r * 25 + 40;
            ctx.beginPath();
            ctx.rect(bx, by, 75, 18);
            ctx.fillStyle = "#38bdf8";
            ctx.fill();
            ctx.closePath();

            // 衝突判定
            if (ballX > bx && ballX < bx + 75 && ballY > by && ballY < by + 18) {
              dy = -dy;
              bricks[c][r].status = 0;
              playSound(587.33, 'triangle', 0.06);
            }
          }
        }
      }

      // ステージクリア判定
      if (remaining === 0) {
        isPlaying = false;
        playSound(880, 'sine', 0.2);
        stage++;
        breakoutStatus.textContent = `🎉 STAGE ${stage - 1} クリア！`;
        setTimeout(initStage, 1200);
        return;
      }

      // ボール描画
      ctx.beginPath();
      ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#f59e0b";
      ctx.fill();
      ctx.closePath();

      // パドル描画
      ctx.beginPath();
      ctx.rect(paddleX, canvas.height - 10, paddleWidth, 10);
      ctx.fillStyle = "#2563eb";
      ctx.fill();
      ctx.closePath();

      // 壁反射
      if (ballX + dx > canvas.width - 6 || ballX + dx < 6) {
        dx = -dx;
        playSound(300, 'sine', 0.03);
      }
      if (ballY + dy < 6) {
        dy = -dy;
        playSound(300, 'sine', 0.03);
      } else if (ballY + dy > canvas.height - 10) {
        // パドル反射判定
        if (ballX > paddleX && ballX < paddleX + paddleWidth) {
          dy = -dy;
          playSound(440, 'sine', 0.05);
        } else if (ballY + dy > canvas.height - 4) {
          // ゲームオーバー
          isPlaying = false;
          playSound(150, 'sawtooth', 0.3);
          breakoutStatus.textContent = `💥 GAME OVER (STAGE ${stage})`;

          // 💡 保存確認ダイアログ
          setTimeout(() => {
            if (confirm(`💥 GAME OVER！最高到達記録（STAGE ${stage}）を記憶リストに保存しますか？`)) {
              saveMemory(`ブロック崩し到達: STAGE ${stage}`, "", ["ゲーム"]);
            }
          }, 300);
          return;
        }
      }

      // パドル移動
      if (rightPressed && paddleX < canvas.width - paddleWidth) {
        paddleX += 7;
      } else if (leftPressed && paddleX > 0) {
        paddleX -= 7;
      }

      ballX += dx;
      ballY += dy;
      animationFrameId = requestAnimationFrame(draw);
    }
  </script>
</body>
</html>
